name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Tool call or CLI command, chip/board, and the firmware if you can share it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx esp32sim-mcp doctor`
      render: text
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (Claude Code, Codex, Cursor, ...)
