name: Release

# Push a tag like v0.2.0 (matching package.json) to publish to npm.
# Publishing uses npm trusted publishing (OIDC): no token is stored in the repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      id-token: write   # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $version"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (skipped if this version is already on the registry)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      # The official MCP registry (registry.modelcontextprotocol.io), via GitHub OIDC like npm above
      - name: Publish to the MCP registry (skipped if this version is listed)
        run: |
          name=$(node -p "require('./server.json').name")
          version=$(node -p "require('./server.json').version")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name&version=latest" | grep -q "\"version\":\"$version\""; then
            echo "$name@$version is already in the MCP registry"
          else
            curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
