name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # A `release: x.y.z` commit is tested by the Release workflow on its tag; skip the duplicate run on main
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Test suite (real-emulator tests skip here)
        run: npm test
      - name: Build dist
        run: npm run build

  e2e:
    name: End-to-end against the real emulator
    runs-on: ubuntu-latest
    # A `release: x.y.z` commit is tested by the Release workflow on its tag; skip the duplicate run on main
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the example with ESP-IDF (ESP32-S3)
        run: |
          docker run --rm -v "$PWD/examples/hello-esp32:/project" -w /project \
            espressif/idf:v5.5.4 idf.py set-target esp32s3 build

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build

      # The same path users take: the prebuilt emulator from this repo's esp32sim-<rev> release and
      # Espressif's esp-rom-elfs, both pinned and SHA-256 checked; nothing is committed here
      - name: Install emulator and mask ROMs
        run: node dist/cli/index.js setup

      - name: Doctor
        run: node dist/cli/index.js doctor

      - name: Test suite, real-emulator tests required
        run: npm test
        env:
          ESP32SIM_REQUIRE_E2E: '1'

      - name: CLI expect on the freshly built example
        run: |
          node dist/cli/index.js expect -p examples/hello-esp32 -s 5 \
            --script examples/hello-esp32/test-button-script.txt \
            --pattern "Hello from esp32sim-mcp" "Button pressed (2)"
